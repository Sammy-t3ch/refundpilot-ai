version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: refundpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: refundpilot
      POSTGRES_PASSWORD: refundpilot
      POSTGRES_DB: refundpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refundpilot -d refundpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refundpilot-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://refundpilot:refundpilot@postgres:5432/refundpilot
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: refundpilot-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
